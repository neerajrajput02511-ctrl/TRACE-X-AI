services:
  tracex:
    build: .
    init: true
    ports: ["127.0.0.1:4318:4318"]
    volumes:
      - cases:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 4
volumes:
  cases:
