<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101d36">
  <meta name="description" content="TRACE-X telecom evidence workspace for importing records, exploring connections and reviewing cited findings.">
  <title>Investigation workspace · TRACE-X</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./console.css">
  <script type="module" src="./console.js"></script>
</head>
<body>
  <a href="#main" class="skip">Skip to case workspace</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Workspace navigation"></aside>
    <div class="workspace">
      <header id="topbar" class="topbar"></header>
      <main id="main" tabindex="-1"><p class="loading">Opening case workspace…</p></main>
    </div>
  </div>
  <dialog id="case-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="status" aria-live="polite" role="status"></div>
  <div id="print-report"></div>
  <noscript>This workspace needs JavaScript to process files on your device.</noscript>
</body>
</html>
